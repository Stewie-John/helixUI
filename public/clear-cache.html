<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache - HelixUI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Clear Cache & Service Worker</h1>
    <p>If you're seeing a blank page or old content, click the button below to clear all cached data.</p>

    <button id="clear-cache-button" type="button">Clear Cache & Reload</button>

    <div id="status"></div>
    <script src="/clear-cache.js" defer></script>
</body>
</html>
