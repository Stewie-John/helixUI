name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver bump or exact version (patch, minor, major, 1.2.3)
        required: true
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --include=dev
      - name: Create tag, GitHub release, and npm package
        run: npx release-it "${{ inputs.version }}" --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
