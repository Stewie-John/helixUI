name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version (for example 1.0.0)
        required: true
        default: 1.0.0

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release input and npm credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) process.exit(1)'
          test -n "$NODE_AUTH_TOKEN"
          npm whoami
      - run: npm ci --include=dev
      - name: Create tag, GitHub release, and npm package
        run: npx release-it "${{ inputs.version }}" --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
