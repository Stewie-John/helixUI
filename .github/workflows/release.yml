name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version (for example 1.0.0)
        required: true
        default: 1.0.0

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release input and npm credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) process.exit(1)'
          test -n "$NODE_AUTH_TOKEN"
          npm whoami
      - run: npm ci --include=dev
      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Detect an already-published npm version
        id: npm-version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          if npm view "$package_name@$RELEASE_VERSION" version --json >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$package_name@$RELEASE_VERSION already exists; recovering Git metadata only."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag, GitHub release, and npm package
        run: npx release-it "${{ inputs.version }}" --ci --npm.publish=${{ steps.npm-version.outputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
